<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鷲巣麻雀 | 開発中</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#071813;color:#f4f1df}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:15px 5vw;border-bottom:1px solid #426d57;background:#101e19}h1{font-family:serif;font-size:24px;margin:0;letter-spacing:.12em}small,.muted{color:#b7c9ba}main{max-width:1100px;margin:auto;padding:24px 16px}h2{font-size:19px;margin:0 0 16px}section{background:#10271e;border:1px solid #426d57;border-radius:14px;padding:20px;margin-bottom:14px}label{display:block;margin:12px 0 6px}input{font:inherit;background:#081811;color:white;border:1px solid #668779;border-radius:8px;padding:11px;width:100%;max-width:320px}button{font:inherit;color:#102217;background:#d8bd72;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:4px}button.secondary{background:#315642;color:white}button:disabled{opacity:.4;cursor:default}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.notice{background:#574422;color:#fff0c2}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.player{background:#0b1c15;border:1px solid #315b47;border-radius:10px;padding:12px}.player.active{border-color:#e6cb7b}.tiles{display:flex;flex-wrap:wrap;gap:5px;min-height:49px;margin:8px 0}.tile{padding:0;margin:0;min-width:35px;height:50px;border:1px solid #cfc6a7;border-bottom:4px solid #a39b80;border-radius:5px;background:linear-gradient(#fffef6,#eee9d7);color:#242b26;font-family:serif;font-size:20px;line-height:1;text-align:center}.tile.clear{background:linear-gradient(135deg,#e0fff9dc,#87cfca85);border-color:#aee3da;color:#093837}.tile.selected{outline:3px solid #f8c960;transform:translateY(-4px)}.tile svg{display:block;width:100%;height:100%;padding:2px}.tile .suit{font-size:11px;color:#a33;display:block}.tile.bamboo{color:#14734c}.tile.pin{color:#264b9c}.tile.hidden{background:#65867c;color:#fff}.tile:disabled{opacity:1}.mini .tile{min-width:27px;height:39px;font-size:16px}.mini .suit{font-size:9px}.actions{margin-top:12px}.status{color:#f6dc8a;min-height:1.5em}.score{font-variant-numeric:tabular-nums}.warning{border-color:#b99654}[hidden]{display:none!important}</style></head><body><header><h1>鷲巣麻雀</h1><small>試作版</small></header><main><section class="notice"><strong>開発中</strong>　一部の麻雀ルールは未完成です。試作の動作確認用です。</section><section id="lobby"><h2>対局の準備</h2><label for="name">お名前</label><input id="name" maxlength="16" placeholder="お名前を入力"><div><button id="create">部屋を作る</button></div><label for="code">合言葉</label><input id="code" maxlength="8" placeholder="8文字の合言葉"><div><button class="secondary" id="join">部屋に入る</button></div></section><div id="table" hidden><section><div class="row"><h2>部屋 <span id="roomCode"></span></h2><button class="secondary" id="copy">合言葉をコピー</button><button class="secondary" id="leave">この端末で退室</button></div><p class="muted">参加者 <span id="count"></span> / 4</p><p id="status" class="status"></p><p id="round" class="muted"></p><button id="next" class="secondary" hidden>次の局へ</button><button id="start">対局を始める</button><div id="players" class="players"></div></section><section id="play" hidden><h2>自分の手牌</h2><div id="hand" class="tiles"></div><p class="muted">牌を選択し、左右に移動できます。打牌は「選択した牌を捨てる」を押してください。</p><div class="actions"><button class="secondary" id="left">左へ移動</button><button class="secondary" id="right">右へ移動</button><button id="discard">選択した牌を捨てる</button><button id="tsumo">ツモ</button><button id="riichi">リーチして打牌</button><button id="ron">ロン</button><button class="secondary" id="pass">パス</button></div><div id="calls" class="actions"></div><p id="result" class="status"></p></section></div><p id="message" role="status" class="status"></p></main><script>
'use strict';let session=JSON.parse(localStorage.getItem('washizu-session')||'null'),state=null,order=[],selected=null,callSelected=[];const $=id=>document.getElementById(id);function faceName(p){return p[0]==='z'?['','東','南','西','北','白','發','中'][Number(p[1])]:p[1]+({m:'萬',p:'筒',s:'索'}[p[0]]||'')}async function api(action,data){let r=await fetch('/api/'+action,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error||'通信エラー');return v}function message(e){$('message').textContent=e?.message||e||''}function suitArt(suit,n){const ns='http://www.w3.org/2000/svg';let svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 30 42');svg.setAttribute('aria-hidden','true');const positions={1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]],7:[[0,0],[2,0],[0,1],[1,1],[2,1],[0,2],[2,2]],8:[[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]],9:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]]};for(let [i,[x,y]] of positions[n].entries()){let g=document.createElementNS(ns,'g');g.setAttribute('transform',`translate(${6+x*9} ${7+y*14})`);if(suit==='p'){let a=document.createElementNS(ns,'circle');a.setAttribute('r','4');a.setAttribute('fill',i%3===0?'#b9483c':i%3===1?'#24645b':'#274d88');g.append(a);let c=document.createElementNS(ns,'circle');c.setAttribute('r','2');c.setAttribute('fill','#f9f7e9');g.append(c);let d=document.createElementNS(ns,'circle');d.setAttribute('r','1');d.setAttribute('fill','#31576e');g.append(d)}else{let a=document.createElementNS(ns,'rect');a.setAttribute('x','-2');a.setAttribute('y','-5');a.setAttribute('width','4');a.setAttribute('height','10');a.setAttribute('rx','1.5');a.setAttribute('fill',i%3===0?'#a93f38':'#247152');g.append(a);for(let q of [-2,2]){let line=document.createElementNS(ns,'path');line.setAttribute('d',`M -2 ${q} h 4`);line.setAttribute('stroke','#fff9dc');line.setAttribute('stroke-width','.8');g.append(line)}}svg.append(g)}return svg} function tile(t,interactive=false){let b=document.createElement('button');b.type='button';b.className='tile'+(t.transparent?' clear':'')+(t.face?.[0]==='s'?' bamboo':'')+(t.face?.[0]==='p'?' pin':'')+((selected===t.id||callSelected.includes(t.id))?' selected':'');if(!t.face){b.className+=' hidden';b.textContent='◆';b.disabled=true;return b}let suit=t.face[0],n=Number(t.face[1]),honors=['','東','南','西','北','白','發','中'];b.setAttribute('aria-label',suit==='z'?honors[n]:n+({m:'萬',p:'筒',s:'索'}[suit]));if(suit==='z')b.textContent=honors[n];else if(suit==='p'||suit==='s')b.append(suitArt(suit,n));else{b.textContent=['','一','二','三','四','五','六','七','八','九'][n];let sub=document.createElement('span');sub.className='suit';sub.textContent='萬';b.append(sub)}b.disabled=!interactive;if(interactive)b.onclick=()=>{if(state.phase==='response'){if(callSelected.includes(t.id))callSelected=callSelected.filter(x=>x!==t.id);else if(callSelected.length<3)callSelected.push(t.id)}else{selected=t.id;callSelected=[]}render()};return b}function render(){ $('lobby').hidden=!!session;$('table').hidden=!session;if(!session||!state)return;$('roomCode').textContent=session.code;$('count').textContent=state.players.length;$('round').textContent=state.phase==='lobby'?'':('東'+state.round+'局 '+state.honba+'本場　残り'+state.wallRemaining+'枚　ドラ表示牌 '+(state.doraIndicators||[state.dora]).map(faceName).join('・'));$('next').hidden=!['won','exhausted'].includes(state.phase)||state.seat!==0;$('start').hidden=state.phase!=='lobby'||state.seat!==0;$('start').disabled=state.players.length!==4;$('play').hidden=state.phase==='lobby';$('status').textContent=state.phase==='lobby'?'４人そろうと開始できます':state.phase==='playing'?(state.turn===state.seat?'あなたの番です':'ほかの参加者の番です'):state.phase==='response'?'打牌への応答を待っています':state.phase==='won'?'和了':state.phase==='finished'?'対局終了':'流局（試作）';let host=$('players');host.replaceChildren();state.players.forEach((p,i)=>{let card=document.createElement('div');card.className='player'+(state.turn===i?' active':'');let title=document.createElement('strong');title.textContent=p.name+(i===state.seat?'（あなた）':'');card.append(title);let score=document.createElement('p');score.className='score';score.textContent=(state.scores?.[i]??25000).toLocaleString()+' 点';card.append(score);if(i!==state.seat&&state.hands[i]){let h=document.createElement('div');h.className='tiles mini';state.hands[i].forEach(t=>h.append(tile(t)));card.append(h)}if(state.melds?.[i]?.length){let m=document.createElement('div');m.className='tiles mini';for(let meld of state.melds[i])for(let t of meld.tiles)m.append(tile(t));card.append(m)}if(state.discards[i]){let d=document.createElement('div');d.className='tiles mini';state.discards[i].forEach(t=>d.append(tile(t)));card.append(d)}host.append(card)});let own=state.hands[state.seat]||[];let map=new Map(own.map(t=>[t.id,t]));order=order.filter(id=>map.has(id));for(let t of own)if(!order.includes(t.id))order.push(t.id);if(selected&&!map.has(selected))selected=null;let hand=$('hand');hand.replaceChildren();order.forEach(id=>hand.append(tile(map.get(id),true)));$('discard').disabled=state.phase!=='playing'||state.turn!==state.seat||!selected;$('tsumo').disabled=state.phase!=='playing'||state.turn!==state.seat;$('riichi').disabled=state.phase!=='playing'||state.turn!==state.seat||!selected||state.riichi[state.seat];$('ron').hidden=state.phase!=='response'||!state.pending||state.pending.discarder===state.seat||state.pending.answered;$('ron').disabled=!state.pending?.canRon;$('pass').hidden=state.phase!=='response'||!state.pending||state.pending.discarder===state.seat||state.pending.answered;let calls=$('calls');calls.replaceChildren();if(state.phase==='response'&&state.pending&&!state.pending.answered&&state.pending.discarder!==state.seat){let p=document.createElement('p');p.className='muted';p.textContent='チー・ポン：手牌から使う牌を選び、鳴き方を押してください。チー・ポンは2枚、カンは3枚です。選択中 '+callSelected.length+'枚';calls.append(p);for(let [kind,label] of [['chi','チー'],['pon','ポン'],['kan','大明カン']])for(let pattern of state.pending.calls[kind]){let b=document.createElement('button');b.textContent=label+' '+[...pattern.slice(1)].filter(x=>/\d/.test(x)).map(n=>n+({m:'萬',p:'筒',s:'索',z:'字'}[pattern[0]])).join('・');b.disabled=callSelected.length!==(kind==='kan'?3:2);b.onclick=()=>respondChoice(kind,pattern,callSelected);calls.append(b)}}if(state.phase==='playing'&&state.turn===state.seat)for(let pattern of state.closedKans||[]){let b=document.createElement('button');b.textContent='暗カン '+pattern[1]+({m:'萬',p:'筒',s:'索',z:'字'}[pattern[0]]);b.onclick=async()=>{try{let ids=(state.hands[state.seat]||[]).filter(t=>t.face===pattern.slice(0,2)).map(t=>t.id);state=await api('closed-kan',{...session,pattern,tileIds:ids});selected=null;render()}catch(e){message(e)}};calls.append(b)}if(state.phase==='playing'&&state.turn===state.seat)for(let pattern of state.addedKans||[]){let b=document.createElement('button');b.textContent='加カン '+pattern[1]+({m:'萬',p:'筒',s:'索',z:'字'}[pattern[0]]);let chosen=(state.hands[state.seat]||[]).find(t=>t.id===selected);b.disabled=!chosen||chosen.face!==pattern[0]+pattern.slice(-1);b.onclick=async()=>{try{state=await api('added-kan',{...session,pattern,tileId:selected});selected=null;render()}catch(e){message(e)}};calls.append(b)}$('result').textContent=!state.result?'':state.result.method==='draw'?'流局　テンパイ：'+state.players.filter((p,i)=>state.result.tenpai[i]).map(p=>p.name).join('、'):state.players[state.result.winner].name+(state.result.method==='ron'?' ロン ':' ツモ ')+state.result.points+'点　'+state.result.yaku.map(y=>y.name).join('・')}
async function refresh(){if(!session)return;try{state=await api('state',session);render();message('')}catch(e){message(e)}}async function enter(action,data){try{session=await api(action,data);localStorage.setItem('washizu-session',JSON.stringify(session));order=[];selected=null;await refresh()}catch(e){message(e)}}$('create').onclick=()=>enter('create',{name:$('name').value});$('join').onclick=()=>enter('join',{name:$('name').value,code:$('code').value});$('next').onclick=async()=>{try{state=await api('next',session);order=[];selected=null;callSelected=[];render()}catch(e){message(e)}};$('start').onclick=async()=>{try{state=await api('start',session);render()}catch(e){message(e)}};$('discard').onclick=async()=>{try{state=await api('discard',{...session,tileId:selected});selected=null;render()}catch(e){message(e)}};$('riichi').onclick=async()=>{try{state=await api('discard',{...session,tileId:selected,riichi:true});selected=null;render()}catch(e){message(e)}};async function respondChoice(choice,pattern,tileIds){try{state=await api('respond',{...session,choice,pattern,tileIds});callSelected=[];render()}catch(e){message(e)}}$('ron').onclick=()=>respondChoice('ron');$('pass').onclick=()=>respondChoice('pass');$('tsumo').onclick=async()=>{try{state=await api('tsumo',session);render()}catch(e){message(e)}};function move(d){let i=order.indexOf(selected),j=i+d;if(i<0||j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];render()}$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(session.code);message('合言葉をコピーしました')}catch{message('合言葉：'+session.code)}};$('leave').onclick=()=>{localStorage.removeItem('washizu-session');session=null;state=null;order=[];selected=null;callSelected=[];render();message('この端末の参加情報を消しました')};render();refresh();setInterval(refresh,2000);
</script></body></html>
